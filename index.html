<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat IA offline</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Georgia, "Times New Roman", serif; font-size: 22px; line-height: 1.4; }
  #app { max-width: 760px; margin: 0 auto; padding: 10px; }
  h1 { font-size: 26px; margin: 0 0 8px 0; }
  .box { border: 3px solid #000; padding: 10px; margin-bottom: 10px; }
  select, input, textarea, button { font-family: inherit; font-size: 22px; color: #000; background: #fff; border: 3px solid #000; border-radius: 0; padding: 10px; box-sizing: border-box; }
  button { font-weight: bold; min-width: 120px; }
  button:disabled { border-style: dashed; color: #555; }
  select { width: 100%; margin-bottom: 8px; }
  textarea { width: 100%; height: 90px; resize: none; }
  #status { margin-top: 8px; min-height: 30px; }
  #bar { border: 3px solid #000; height: 22px; margin-top: 8px; display: none; }
  #bar div { background: #000; height: 100%; width: 0; }
  #chat { margin-bottom: 10px; }
  .msg { border: 3px solid #000; padding: 8px 10px; margin-bottom: 8px; white-space: pre-wrap; word-wrap: break-word; }
  .user { margin-left: 40px; }
  .bot { margin-right: 40px; border-style: double; border-width: 6px; }
  .who { font-weight: bold; }
  #row { margin-top: 8px; }
  #row button { margin-right: 8px; }
  #notebook { display: none; }
  #notetext { height: 300px; font-size: 16px; font-family: "Courier New", monospace; }
  #notebtns button { margin-right: 8px; margin-top: 8px; }
</style>
</head>
<body>
<div id="app">
  <h1>Chat IA offline</h1>

  <div class="box" id="setup">
    <label for="model">Modelo:</label>
    <select id="model">
      <option value="smol">SmolLM2 135M (~145 MB, mais leve)</option>
      <option value="qwen">Qwen2.5 0.5B (~490 MB, mais esperto)</option>
    </select>
    <button id="load" type="button">Carregar</button>
    <div id="bar"><div id="barfill"></div></div>
    <div id="status">Escolha um modelo e toque em Carregar. O download acontece só na primeira vez.</div>
  </div>

  <div id="chat"></div>

  <div class="box">
    <textarea id="input" placeholder="Digite sua mensagem" disabled></textarea>
    <div id="row">
      <button id="send" type="button" disabled>Enviar</button>
      <button id="stop" type="button" disabled>Parar</button>
      <button id="clear" type="button">Limpar</button>
      <button id="notebtn" type="button">Caderno</button>
    </div>
  </div>

  <div class="box" id="notebook">
    <div class="who">Caderno de logs</div>
    <textarea id="notetext" readonly></textarea>
    <div id="notebtns">
      <button id="notecopy" type="button">Copiar</button>
      <button id="noteclear" type="button">Zerar</button>
      <button id="noteclose" type="button">Fechar</button>
    </div>
    <div id="notemsg"></div>
  </div>
</div>

<!-- Caderno: registra erros, ambiente e passos importantes -->
<script>
(function () {
  var t0 = new Date().getTime(), lines = [], MAX = 300;
  function ts() { return ((new Date().getTime() - t0) / 1000).toFixed(1) + 's'; }
  function str(a) {
    try {
      if (a && a.stack) return String(a.stack).split('\n').slice(0, 4).join(' | ');
      if (a && a.message) return String(a.message);
      if (typeof a === 'object') return JSON.stringify(a);
      return String(a);
    } catch (e) { return '?'; }
  }
  function log(level, msg) {
    msg = String(msg);
    if (msg.length > 400) msg = msg.slice(0, 400) + '...';
    lines.push('[' + ts() + '] ' + level + ' ' + msg);
    if (lines.length > MAX) lines.splice(0, lines.length - MAX);
    if (window.NotebookRender) window.NotebookRender();
  }
  window.Notebook = {
    log: log,
    text: function () { return lines.join('\n'); },
    clear: function () { lines = []; }
  };

  function wrap(name, level) {
    try {
      var orig = console[name];
      console[name] = function () {
        var parts = [];
        for (var i = 0; i < arguments.length; i++) parts.push(str(arguments[i]));
        log(level, parts.join(' '));
        if (orig) { try { orig.apply(console, arguments); } catch (e) {} }
      };
    } catch (e) {}
  }
  wrap('error', 'ERRO');
  wrap('warn', 'AVISO');

  window.onerror = function (msg, src, line, col) {
    log('ERRO', 'js: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ':' + col + ')');
  };
  if (window.addEventListener) {
    window.addEventListener('unhandledrejection', function (ev) { log('ERRO', 'promessa: ' + str(ev.reason)); });
  }

  function check(bytes) {
    try { return window.WebAssembly && WebAssembly.validate(new Uint8Array(bytes)) ? 'sim' : 'nao'; } catch (e) { return 'nao'; }
  }
  var simd = check([0,97,115,109,1,0,0,0,1,5,1,96,0,1,123,3,2,1,0,10,10,1,8,0,65,0,253,15,253,98,11]);
  var mem64 = check([0,97,115,109,1,0,0,0,5,3,1,4,0]);
  log('INFO', 'navegador: ' + navigator.userAgent);
  log('INFO', 'tela: ' + screen.width + 'x' + screen.height + ' | modulos JS: ' + (('noModule' in document.createElement('script')) ? 'sim' : 'nao'));
  log('INFO', 'WebAssembly: ' + (window.WebAssembly ? 'sim' : 'nao') + ' | SIMD: ' + simd + ' | Memory64: ' + mem64);
  log('INFO', 'SharedArrayBuffer: ' + (typeof SharedArrayBuffer !== 'undefined' ? 'sim' : 'nao') + ' | isolado: ' + (window.crossOriginIsolated ? 'sim' : 'nao') + ' | nucleos: ' + (navigator.hardwareConcurrency || '?') + ' | RAM(GB): ' + (navigator.deviceMemory || '?'));
  log('INFO', 'cache/OPFS: ' + ((navigator.storage && navigator.storage.getDirectory) ? 'sim' : 'nao') + ' | fetch: ' + (window.fetch ? 'sim' : 'nao'));

  setTimeout(function () {
    if (!window.EngineLoader) log('ERRO', 'motor da IA nao iniciou (modulo JS nao executou)');
  }, 3000);
})();
</script>

<!-- Interface (JS simples, compatível com navegadores antigos) -->
<script>
(function () {
  var MODELS = {
    smol: { repo: 'HuggingFaceTB/SmolLM2-135M-Instruct-GGUF', file: 'smollm2-135m-instruct-q8_0.gguf' },
    qwen: { repo: 'Qwen/Qwen2.5-0.5B-Instruct-GGUF', file: 'qwen2.5-0.5b-instruct-q4_k_m.gguf' }
  };
  var SYSTEM = 'Você é um assistente útil. Responda em português, de forma curta e clara.';
  var history = [];
  var engine = null;
  var busy = false;

  function $(id) { return document.getElementById(id); }
  function setStatus(t) { $('status').innerHTML = ''; $('status').appendChild(document.createTextNode(t)); }
  function setBar(p) {
    $('bar').style.display = p === null ? 'none' : 'block';
    if (p !== null) { $('barfill').style.width = Math.max(0, Math.min(100, p)) + '%'; }
  }
  function addMsg(cls, who, text) {
    var d = document.createElement('div');
    d.className = 'msg ' + cls;
    var w = document.createElement('span');
    w.className = 'who';
    w.appendChild(document.createTextNode(who + ': '));
    var t = document.createElement('span');
    t.appendChild(document.createTextNode(text));
    d.appendChild(w); d.appendChild(t);
    $('chat').appendChild(d);
    window.scrollTo(0, document.body.scrollHeight);
    return t;
  }
  function setBusy(b) {
    busy = b;
    $('send').disabled = b || !engine;
    $('stop').disabled = !b;
    $('input').disabled = b || !engine;
  }

  window.UI = { engineReady: function (e) { engine = e; } };

  $('load').onclick = function () {
    if (!window.EngineLoader) {
      setStatus('Este navegador não suporta módulos JS. A IA não pode rodar aqui.');
      return;
    }
    $('load').disabled = true; $('model').disabled = true;
    setStatus('Iniciando...'); setBar(0);
    var lastTen = -1, tLoad = new Date().getTime();
    Notebook.log('PASSO', 'carregar modelo: ' + $('model').value);
    window.EngineLoader(MODELS[$('model').value], function (p) {
      setBar(p); setStatus('Baixando modelo: ' + Math.round(p) + '%');
      var ten = Math.floor(p / 10);
      if (ten !== lastTen) { lastTen = ten; Notebook.log('PASSO', 'download ' + (ten * 10) + '%'); }
    }).then(function (e) {
      engine = e; setBar(null);
      Notebook.log('PASSO', 'modelo pronto em ' + ((new Date().getTime() - tLoad) / 1000).toFixed(1) + 's');
      setStatus('Pronto. Pode conversar.');
      setBusy(false);
    }, function (err) {
      setBar(null);
      Notebook.log('ERRO', 'carregar falhou: ' + (err && err.stack ? String(err.stack).split('\n').slice(0, 3).join(' | ') : err));
      setStatus('Erro ao carregar: ' + (err && err.message ? err.message : err));
      $('load').disabled = false; $('model').disabled = false;
    });
  };

  $('send').onclick = function () {
    var text = $('input').value.replace(/^\s+|\s+$/g, '');
    if (!text || busy || !engine) return;
    $('input').value = '';
    addMsg('user', 'Você', text);
    history.push({ role: 'user', content: text });
    if (history.length > 6) history = history.slice(history.length - 6);
    var out = addMsg('bot', 'IA', '...');
    setBusy(true); setStatus('Pensando... (pode demorar)');
    var msgs = [{ role: 'system', content: SYSTEM }].concat(history);
    var tSend = new Date().getTime(), tFirst = 0;
    Notebook.log('PASSO', 'enviar pergunta (' + text.length + ' letras, historico ' + history.length + ')');
    engine.chat(msgs, function (partial) {
      if (!tFirst && partial) { tFirst = new Date().getTime(); Notebook.log('PASSO', 'primeira palavra em ' + ((tFirst - tSend) / 1000).toFixed(1) + 's'); }
      out.firstChild.nodeValue = partial || '...';
    }).then(function (full) {
      Notebook.log('PASSO', 'resposta completa: ' + (full || '').length + ' letras em ' + ((new Date().getTime() - tSend) / 1000).toFixed(1) + 's');
      full = full || '(sem resposta)';
      out.firstChild.nodeValue = full;
      history.push({ role: 'assistant', content: full });
      setBusy(false); setStatus('Pronto.');
    }, function (err) {
      Notebook.log('ERRO', 'resposta falhou: ' + (err && err.stack ? String(err.stack).split('\n').slice(0, 3).join(' | ') : err));
      out.firstChild.nodeValue = '[erro] ' + (err && err.message ? err.message : err);
      setBusy(false); setStatus('Erro.');
    });
  };

  $('stop').onclick = function () { Notebook.log('PASSO', 'parar'); if (engine && engine.stop) engine.stop(); };

  // Caderno
  function renderNote() {
    var box = $('notebook');
    if (box.style.display === 'block') {
      var ta = $('notetext');
      ta.value = Notebook.text();
      ta.scrollTop = ta.scrollHeight;
    }
  }
  window.NotebookRender = renderNote;
  $('notebtn').onclick = function () {
    var box = $('notebook');
    box.style.display = 'block';
    $('notemsg').innerHTML = '';
    renderNote();
    box.scrollIntoView ? box.scrollIntoView() : null;
  };
  $('noteclose').onclick = function () { $('notebook').style.display = 'none'; };
  $('noteclear').onclick = function () { Notebook.clear(); Notebook.log('INFO', 'caderno zerado'); renderNote(); };
  $('notecopy').onclick = function () {
    var ta = $('notetext'), ok = false;
    ta.value = Notebook.text();
    try { ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length); ok = document.execCommand('copy'); } catch (e) {}
    function done(good) {
      $('notemsg').innerHTML = '';
      $('notemsg').appendChild(document.createTextNode(good ? 'Copiado.' : 'Não deu para copiar sozinho: o texto está selecionado, copie manualmente.'));
    }
    if (ok) { done(true); }
    else if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(function () { done(true); }, function () { done(false); });
    } else { done(false); }
  };
  $('clear').onclick = function () { history = []; $('chat').innerHTML = ''; };
})();
</script>

<!-- Motor da IA: roda a LLM no próprio navegador (WebAssembly) via wllama -->
<script type="module">
const WLLAMA_VERSION = '2.3.0';
const BASE = 'https://cdn.jsdelivr.net/npm/@wllama/wllama@' + WLLAMA_VERSION + '/esm/';

window.EngineLoader = async function (model, onProgress) {
  const L = window.Notebook;
  L.log('PASSO', 'importando wllama ' + WLLAMA_VERSION);
  const t0 = Date.now();
  const mod = await import(BASE + 'index.js');
  L.log('PASSO', 'wllama importado em ' + ((Date.now() - t0) / 1000).toFixed(1) + 's');
  const wllama = new mod.Wllama({
    'single-thread/wllama.wasm': BASE + 'single-thread/wllama.wasm',
    'multi-thread/wllama.wasm': BASE + 'multi-thread/wllama.wasm'
  });
  L.log('PASSO', 'carregando ' + model.file);
  await wllama.loadModelFromHF(model.repo, model.file, {
    n_ctx: 1024,
    progressCallback: function (p) { onProgress(p.total ? (p.loaded / p.total) * 100 : 0); }
  });

  let aborter = null;
  const END = '<|im_end|>';

  function toPrompt(messages) {
    let s = '';
    for (const m of messages) s += '<|im_start|>' + m.role + '\n' + m.content + END + '\n';
    return s + '<|im_start|>assistant\n';
  }

  return {
    chat: async function (messages, onPartial) {
      aborter = new AbortController();
      let text = '';
      const clean = function (t) { const i = t.indexOf(END); return (i >= 0 ? t.slice(0, i) : t).trim(); };
      try {
        await wllama.createCompletion(toPrompt(messages), {
          nPredict: 200,
          sampling: { temp: 0.6, top_k: 40, top_p: 0.9 },
          abortSignal: aborter.signal,
          onNewToken: function (token, piece, currentText) {
            text = currentText;
            if (text.indexOf(END) >= 0) aborter.abort();
            onPartial(clean(text));
          }
        });
      } catch (e) {
        if (!(aborter && aborter.signal.aborted)) throw e;
      }
      return clean(text);
    },
    stop: function () { if (aborter) aborter.abort(); }
  };
};
</script>
</body>
</html>
